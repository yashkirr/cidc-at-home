<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI/CD at home</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --line: #e2e2dd; --text: #18181a; --muted: #67676d;
    --accent: #c8102e; --accent-text: #ffffff;
    --run: #1f6feb; --pass: #1a7f37; --fail: #c8102e; --stop: #9a6700; --wait: #8a8a90; --mark: #ffffff;
    --log-bg: #111113; --log-text: #e6e6e8;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11; --panel: #18181b; --line: #2a2a2f; --text: #ededf0; --muted: #9a9aa2;
      --accent: #c91d2f; --run: #4c8dff; --pass: #3fb950; --fail: #ff6b6b; --stop: #d4a72c; --wait: #6e6e76; --mark: #0f0f11;
      --log-bg: #09090b; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 500; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  select, input[type=text] { min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  input[type=text] { width: 160px; }
  .grow { flex: 1; }
  .add { display: flex; gap: 8px; }
  .bar.first { margin-top: 0; }
  .wide { width: 100%; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600;
         transition: transform 150ms var(--ease), opacity 150ms var(--ease), border-color 150ms var(--ease), background-color 150ms var(--ease); }
  @media (hover: hover) { .btn:hover:not(:disabled), .stage:hover { border-color: var(--muted); } .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--text)); } }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:disabled { background: var(--panel); border-color: var(--line); color: var(--muted); opacity: 1; }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
  ::selection { background: color-mix(in srgb, var(--run) 30%, transparent); }
  ::placeholder { color: var(--muted); }
  pre { scrollbar-color: var(--wait) transparent; }
  :focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }
  main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 20px; padding: 20px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 12px 16px; } }
  .full { grid-column: 1 / -1; }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
  .prs { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 6px; max-height: 52vh; overflow: auto; }
  .prs label { align-items: flex-start; color: var(--text); padding: 8px; border-radius: 8px; cursor: pointer; min-height: 44px; }
  .prs label:hover { background: var(--bg); }
  .prs input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
  .prs small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .tag { white-space: nowrap; font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; color: var(--muted); margin-left: 4px; }
  .empty { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  /* The pipeline is one flow, left to right: queue, build stages, the deploy gate, deploy stages, what is live. */
  .flow { position: relative; display: flex; align-items: flex-start; overflow-x: auto; padding: 2px 2px 10px; scrollbar-color: var(--wait) transparent; }
  /* More of the flow off to the right: fade the edge so it reads as "scroll for more". */
  .flow.more { mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent); }
  .node { flex: 1 1 0; min-width: 150px; max-width: 240px; text-align: left; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stage { cursor: pointer; transition: transform 150ms var(--ease), border-color 150ms var(--ease); }
  .stage:active { transform: scale(0.98); }
  .stage[aria-pressed=true] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  .node .top { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .node .who { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0 0; min-height: 22px; }
  .node .who:empty { display: none; }
  .node .time { display: block; color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .chip { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 1px 8px; border-radius: 99px; background: color-mix(in srgb, var(--text) 8%, transparent); }
  .chip.running { background: color-mix(in srgb, var(--run) 16%, transparent); }
  .chip.passed { background: color-mix(in srgb, var(--pass) 16%, transparent); }
  .chip.failed, .chip.bad { background: color-mix(in srgb, var(--fail) 16%, transparent); }
  .none { color: var(--muted); font-size: 13px; }
  .node .under { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); }
  .node .under:empty { display: none; }
  .gate { border-style: dashed; gap: 8px; background: transparent; }
  .gate p { margin: 0; font-size: 13px; color: var(--muted); }
  .gate .btn { width: 100%; padding: 0 12px; }
  .queue ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
  .queue li { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 28px; }
  .queue li .btn { margin-left: auto; min-height: 28px; padding: 0 8px; font-size: 12px; }
  .live { border-color: color-mix(in srgb, var(--pass) 45%, var(--line)); }
  .rules { margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); list-style: none; display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
  .blocked { margin: 10px 0 0; display: grid; gap: 8px; }
  .blocked p { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
  .blocked .btn, .live > .btn { justify-self: start; min-height: 36px; padding: 0 10px; font-size: 13px; }
  .live > .btn { margin-top: 10px; align-self: flex-start; }
  .chip.held { background: color-mix(in srgb, var(--stop) 18%, transparent); }
  .live.isblocked { border-color: color-mix(in srgb, var(--stop) 55%, var(--line)); }
  .live .prs-in { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .par { flex: 1 1 0; min-width: 150px; max-width: 240px; display: flex; flex-direction: column; gap: 8px; }
  .par > .node { max-width: none; flex: 1 0 auto; }
  .arrow { align-self: flex-start; margin-top: 15px; color: var(--muted); flex: none; padding: 0 6px; }
  .arrow svg { width: 16px; height: 16px; display: block; }
  @media (max-width: 1000px) { .flow { flex-direction: column; overflow: visible; } .node, .par { max-width: none; } .par { padding-left: 10px; border-left: 2px solid var(--line); } .arrow { align-self: flex-start; margin-top: 0; padding: 4px 0 4px 18px; transform: rotate(90deg); } }
  .steps { margin: 0; padding: 0; font-size: 13px; color: var(--muted); display: grid; gap: 3px; }
  .steps > .todo { color: var(--muted); }
  .steps > span { display: flex; gap: 6px; align-items: center; }
  .icon { width: 18px; height: 18px; flex: none; }
  .steps .icon { width: 13px; height: 13px; }
  .steps .note { display: block; font-size: 12px; }
  .steps > span:has(.note) { align-items: flex-start; } .steps > span:has(.note) .icon { margin-top: 3px; }
  .waiting { color: var(--wait); } .running { color: var(--run); } .passed { color: var(--pass); } .failed { color: var(--fail); } .stopped, .held { color: var(--stop); } .skipped { color: var(--wait); }
  .running.icon { animation: pulse 1.2s var(--ease) infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .bar { display: flex; gap: 10px; align-items: center; margin: 16px 0 8px; flex-wrap: wrap; }
  .bar h2 { margin: 0; }
  pre:empty::before { content: attr(data-empty); color: color-mix(in srgb, var(--log-text) 65%, var(--log-bg)); }
  .hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .livenow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
  pre { margin: 0; background: var(--log-bg); color: var(--log-text); border-radius: 10px; padding: 12px; height: 46vh; overflow: auto; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--fail) 12%, transparent); color: var(--text); border: 1px solid var(--fail); }
  .history { list-style: none; margin: 0; padding: 0; display: grid; }
  .history > li { border-top: 1px solid var(--line); }
  .history > li:first-child { border-top: 0; }
  .hrow { width: 100%; display: grid; grid-template-columns: 64px 128px 1fr auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; padding: 10px 6px; cursor: pointer; border-radius: 8px; min-height: 44px; }
  @media (hover: hover) { .hrow:hover { background: var(--bg); } }
  .hrow b { font-variant-numeric: tabular-nums; }
  .hrow .what { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .hrow time { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hdetail { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 6px 12px 82px; }
  .hdetail .btn { min-height: 32px; padding: 0 10px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  @media (max-width: 700px) { .hrow { grid-template-columns: 48px 1fr; } .hrow .what, .hrow time { grid-column: 2; } .hdetail { padding-left: 6px; } }
  .chip.queued, .chip.building, .chip.deploying { background: color-mix(in srgb, var(--run) 16%, transparent); }
  .chip.live, .chip.good { background: color-mix(in srgb, var(--pass) 16%, transparent); }
  .agent { list-style: none; margin: 0; padding: 0; display: grid; }
  .agent li { display: grid; grid-template-columns: 170px minmax(120px, 200px) 1fr auto; gap: 12px; align-items: baseline; padding: 8px 6px; border-top: 1px solid var(--line); font-size: 14px; }
  .agent li:first-child { border-top: 0; }
  #reads { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
  .agent li.empty { display: block; margin: 0; }
  .agent li.read { color: var(--muted); }
  .agent time, .agent .by { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .agent time { white-space: nowrap; }
  .agent .why { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  @media (max-width: 700px) { .agent li { grid-template-columns: 1fr auto; } .agent time, .agent .by { grid-column: 1 / -1; } .agent .by { grid-row: 1; } .agent time { grid-row: 2; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <h1>CI/CD at home</h1>
  <span class="livenow" id="liveNow"></span>
  <label>Repo <select id="repo" aria-label="Repo"></select></label>
  <form id="addForm" class="add"><input type="text" id="addPath" placeholder="/path/to/repo" aria-label="Add a repo folder"><button class="btn small">Add repo</button></form>
  <span class="grow"></span>
  <label>AWS profile (optional) <input type="text" id="profile" placeholder="default" autocomplete="off" spellcheck="false"></label>
</header>
<main>
  <section class="panel full" aria-labelledby="flowTitle">
    <div id="error" class="msg" role="alert" hidden></div>
    <h2 id="flowTitle">Pipeline</h2>
    <div class="flow" id="flow"></div>
  </section>
  <section class="panel" aria-labelledby="prsTitle">
    <div class="bar first"><h2 id="prsTitle">Open pull requests</h2><span class="grow"></span><button class="btn small" id="refresh">Refresh</button></div>
    <ul class="prs" id="prs"></ul>
    <button class="btn primary wide" id="build">Build</button>
    <p class="hint">Merges the ticked PRs onto <span class="branch">main</span> in a test folder and runs your checks. Nothing changes on GitHub until you deploy.</p>
  </section>
  <section class="panel" aria-labelledby="logTitle">
    <div class="bar first"><h2 id="logTitle">Log</h2><span class="grow"></span><button class="btn small primary" id="retry" hidden></button><button class="btn small" id="stopBuild" hidden>Stop build</button><button class="btn small" id="stopDeploy" hidden>Stop deploy</button></div>
    <pre id="log" tabindex="0" aria-labelledby="logTitle"></pre>
    <p class="sr" aria-live="polite" id="live"></p>
  </section>
  <section class="panel full" aria-labelledby="buildsTitle">
    <h2 id="buildsTitle">All builds</h2>
    <ol class="history" id="history"></ol>
  </section>
  <section class="panel full" aria-labelledby="agentTitle">
    <div class="bar first"><h2 id="agentTitle">Agent activity</h2><span class="grow"></span><label><input type="checkbox" id="reads"> Show reads</label></div>
    <ol class="agent" id="agent"></ol>
  </section>
</main>
<script>
const TOKEN = '__TOKEN__';
const $ = (id) => document.getElementById(id);
let viewing = null, openBuild = null, buildStages = []; // an older build's log shown in the Log panel
let state = null, agentLog = [], repos = [], picked = new Set(), selected = 'batch', lastLive = '', logs = {}, wasRunning = [], boot = 0;
const profile = $('profile');
try { profile.value = localStorage.getItem('pipeline:profile') || ''; } catch {}
profile.addEventListener('change', () => { try { localStorage.setItem('pipeline:profile', profile.value.trim()); } catch {} });

async function post(path, body = {}) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-token': TOKEN }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) showError(j.error || 'That did not work.');
  return r.ok;
}
function showError(text) { const e = $('error'); e.textContent = text || ''; e.hidden = !text; }

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const label = { waiting: 'Waiting', running: 'Running', passed: 'Passed', failed: 'Failed', stopped: 'Stopped', held: 'On hold', skipped: 'skipped (passed earlier)' };
// One drawn set: filled disc + white mark for an outcome, outline ring while waiting, half disc while running.
const mark = {
  waiting: '<circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2"/>',
  running: '<circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4a5 5 0 0 1 0 10z" fill="currentColor"/>',
  passed: '<circle cx="9" cy="9" r="8" fill="currentColor"/><path d="m5.5 9.2 2.3 2.3 4.7-4.9" fill="none" stroke="var(--mark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  failed: '<circle cx="9" cy="9" r="8" fill="currentColor"/><path d="m6.2 6.2 5.6 5.6m0-5.6-5.6 5.6" stroke="var(--mark)" stroke-width="2" stroke-linecap="round"/>',
  stopped: '<circle cx="9" cy="9" r="8" fill="currentColor"/><rect x="6" y="6" width="6" height="6" rx="1" fill="var(--mark)"/>',
  held: '<circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.2 6v6m3.6-6v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  skipped: '<circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m5.8 9.2 2.1 2.1 4.3-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
};
const icon = (st) => `<svg class="icon ${st}" viewBox="0 0 18 18" aria-hidden="true">${mark[st]}</svg>`;
function took(s) {
  if (s.interrupted) return 'Stopped when the app closed';
  if (s.status === 'held') return s.note;
  if (!s.started) return label[s.status];
  const sec = Math.round(((s.ended || Date.now()) - s.started) / 1000);
  return `${label[s.status]}, ${sec < 60 ? sec + ' s' : Math.floor(sec / 60) + ' min ' + (sec % 60) + ' s'}`;
}

// The first environment a deploy goes to: the merge's.
const firstEnv = () => state.lives[0]?.environment ?? state.config.environment;
// What guards an environment, from "environments" in pipeline.json, in plain words.
const DAY = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
function rules(environment) {
  const c = state.config.environments?.[environment];
  if (!c) return '';
  const order = Object.keys(DAY), when = (w) => {
    const i = w.days.map((d) => order.indexOf(d)), run = i.every((x, k) => !k || x === i[k - 1] + 1);
    return w.days.length === 7 ? 'every day' : run && i.length > 2 ? `${DAY[w.days[0]]} to ${DAY[w.days.at(-1)]}` : w.days.map((d) => DAY[d]).join(', ');
  };
  const n = c.gates.length, wait = c.bake >= 6e4 ? `${Math.round(c.bake / 6e4)} min` : `${Math.round(c.bake / 1e3)} s`;
  const lines = [
    c.bake ? `Bakes ${wait}` : '',
    n ? `${n} health gate${n > 1 ? 's' : ''}${c.rollback ? ', rolls back if one fails' : ''}` : '',
    c.autoPromote ? '' : 'You promote each build',
    ...c.windows.map((w) => `Deploys ${when(w)}, ${w.from} to ${w.to}${c.timezone ? ` ${c.timezone}` : ''}`),
  ].filter(Boolean);
  return lines.length ? `<ul class="rules">${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>` : '';
}

// Each stage is a node in the flow: its name and state, the build in it, and its checks underneath.
function stageCard(s, build) {
  return `<button class="node stage" data-id="${s.id}" aria-pressed="${s.id === selected}">
    <span class="top">${icon(s.status)}${esc(s.name)}</span>
    <span class="who">${build && s.status !== 'waiting' ? `<span class="chip ${s.status}">Build #${build}</span>` : ''}${s.environment && s.environment !== state.config.environment ? `<span class="none">to ${esc(s.environment)}</span>` : ''}</span>
    <span class="time">${esc(took(s))}</span>
    <span class="under steps">${stepList(s)}</span>
  </button>`;
}
// The stage's steps so far, then the rest of what ran there last time, still to come.
function stepList(s) {
  const seen = new Set(s.steps.map((t) => t.name.replace(/#\d+/g, '#N')));
  const todo = s.status === 'passed' ? [] : (state.planned[s.name] ?? []).filter((n) => !seen.has(n)).map((name) => ({ name, status: 'waiting' }));
  const all = [...s.steps, ...todo];
  return all.length ? all.map((t) => `<span class="${t.status === 'waiting' ? 'todo' : ''}">${icon(t.status)}<span>${esc(t.name)}${t.status === 'skipped' ? `<span class="note">${label.skipped}</span>` : `<span class="sr"> ${label[t.status]}</span>`}</span></span>`).join('')
    : '';
}

// Redrawing replaces the PR list and stage cards, so put keyboard focus back where it was.
function render() {
  const f = document.activeElement;
  const key = f?.id ? '#' + f.id : f?.dataset?.id ? `.stage[data-id="${CSS.escape(f.dataset.id)}"]` : f?.type === 'checkbox' ? `#prs input[value="${f.value}"]` : null;
  draw();
  if (key && document.activeElement !== f) document.querySelector(key)?.focus();
}

function draw() {
  $('repo').innerHTML = repos.map((r) => `<option value="${esc(r)}" ${state && r === state.repo ? 'selected' : ''}>${esc(r.split('/').pop())}</option>`).join('') || '<option>Add a repo</option>';
  $('build').disabled = $('refresh').disabled = !state;
  if (!state) { $('flow').innerHTML = '<p class="empty">Add a repo folder that has a pipeline.json.</p>'; return; }
  document.querySelector('.hint .branch').textContent = state.config.branch;
  // What is live right now, up top, so it never needs a scroll along the flow to find.
  $('liveNow').innerHTML = 'Live: ' + state.lives.map(({ environment, live: l }) => `<span class="chip ${l ? 'passed' : ''}">${esc(environment)}: ${l ? 'build #' + l.number : 'none yet'}</span>`).join('');
  const busy = state.building, inDeploy = (n) => state.deployingPrs.includes(n);
  const inBuild = (n) => [state.deployingBuild, ...state.queue, state.build].find((b) => b?.prs.some((p) => p.number === n));
  showError(state.error);

  $('prs').innerHTML = state.prs.length ? state.prs.map((p) => `<li><label>
      <input type="checkbox" value="${p.number}" ${picked.has(p.number) && !p.draft && !inDeploy(p.number) ? 'checked' : ''} ${!state.canBuild || p.draft || inDeploy(p.number) ? 'disabled' : ''}>
      <span>#${p.number} ${esc(p.title)}${p.draft ? '<span class="tag">draft</span>' : ''}${inDeploy(p.number) ? `<span class="tag">in build #${inBuild(p.number)?.number}</span>` : ''}<small>${esc(p.branch)} by ${esc(p.author)}</small></span>
    </label></li>`).join('') : '<li class="empty">No open pull requests.</li>';
  const n = pickable().length;
  $('build').textContent = (state.deploying || state.building || state.queue.length ? 'Build next batch' : `Build ${state.config.branch}`) + (n ? ` + ${n} PR${n > 1 ? 's' : ''}` : '');
  $('build').disabled = !state.canBuild;
  $('refresh').disabled = false;

  const build = state.stages.filter((s) => s.group === 'build');
  const deploy = state.stages.filter((s) => s.group === 'deploy');
  const merged = state.picked.length ? `merges ${state.picked.map((x) => '#' + x).join(', ')} into ${state.config.branch} on GitHub, then deploys.` : `deploys ${state.config.branch} as it is.`;
  const arrow = '<span class="arrow" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h9m-3.5-3.5L12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  const num = state.build.number, stacked = state.stackedOn ? `, on build #${state.stackedOn}` : '';
  const queue = !(state.buildOk && !state.deploying && !state.queue.length);
  const place = state.queue.findIndex((b) => b.number === num) + 1;
  const gate = state.queued ? `Build #${num} is number ${place} in the queue. It deploys on its own${busy ? ' once it passes' : ''}${place > 1 || state.deploying ? ', after the builds in front' : ''}.`
    : state.build.bad ? esc(state.build.bad)
    : state.config.autoDeploy && !(state.buildOk && !state.queued) ? (state.deploying ? 'Deploying. You can build the next batch now.' : 'Every build deploys on its own once its stages pass.')
    : state.buildOk && queue ? `Build #${num} passed. Queue it to deploy after the builds in front.`
    : busy ? `Queue build #${num} now to deploy as soon as it passes.`
    : state.buildOk ? `Build #${num} passed. This ` + merged
    : state.deploying ? 'Deploying. You can build the next batch now.'
    : state.build.status === 'live' ? `Build #${num} is live. Tick PRs and build again to ship more.`
    : state.build.status === 'failed' ? `Deploying build #${num} failed. Check the log, then retry or build again.`
    : 'Unlocks when every build stage passes.';
  // "Queue" only when something is in front of it: a build still running, or a deploy or queue ahead.
  const later = busy || (state.buildOk && (state.deploying || state.queue.length));
  const env = esc(firstEnv());
  const qItem = (b, i) => {
    const st = b.building ? 'Building' : 'Green';
    const last = i === state.queue.length - 1;
    return `<li><span class="chip ${st === 'Green' ? 'passed' : 'running'}">#${b.number}</span><span>${st}</span>${last ? `<button class="btn" data-remove="${b.number}" aria-label="Take build #${b.number} off the queue">Remove</button>` : ''}</li>`;
  };
  const queueNode = `<div class="node queue" role="group" aria-label="Deploy queue">
      <span class="top">Deploy queue</span>
      <span class="who">${state.queue.length ? `<span class="chip">${state.queue.length} waiting</span>` : '<span class="none">Empty</span>'}</span>
      <span class="time">${state.paused ? 'Paused. Nothing deploys until you resume' : state.queue.length ? 'Deploys in this order' : 'Green builds wait here to deploy'}</span>
      <div class="under">${state.paused ? '<button class="btn small" id="resume">Resume queue</button>' : ''}${state.queue.length ? `<ol>${state.queue.map(qItem).join('')}</ol>` : ''}</div>
    </div>`;
  const gateNode = `<div class="node gate" role="group" aria-label="Deploy">
      <span class="top">Deploy to ${env}</span>
      ${state.queued ? `<span class="who"><span class="chip">Build #${num} queued</span></span>` : state.config.autoDeploy && !state.buildOk ? '' : `<button class="btn primary" id="deploy" ${state.buildOk || busy ? '' : 'disabled'}>${later ? 'Queue deploy' : 'Deploy'}</button>`}
      <p>${gate}</p>
    </div>`;
  // One card per environment the deploy makes live (pipeline.json "environment"), stacked like parallel stages.
  // Each says what guards it (bake, health checks, promote, deploy hours) and can be blocked.
  const liveCard = ({ environment, live: l }) => {
    const blk = state.blocks[environment], e = esc(environment);
    return `<div class="node live ${blk ? 'isblocked' : ''}" role="group" aria-label="Live in ${e}">
      <span class="top">${l ? icon('passed') : icon('waiting')}Live in ${e}</span>
      <span class="who">${l ? `<span class="chip passed">Build #${l.number}</span>${l.rollbackOf ? `<span class="none">rollback to #${l.rollbackOf}</span>` : ''}` : '<span class="none">Nothing yet</span>'}</span>
      <span class="time">${l ? new Date(l.at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'Deploy a build to see it here'}</span>
      <ul class="under prs-in">${l ? (l.prs.length ? l.prs.map((p) => `<li>#${p.number} ${esc(p.title)}</li>`).join('') : `<li>${esc(state.config.branch)} as it was, no PRs</li>`) : ''}</ul>
      ${rules(environment)}
      ${blk ? `<div class="blocked"><p><span class="chip held">Blocked</span> ${esc(blk.reason)}</p><button class="btn" data-unblock="${e}">Unblock ${e}</button></div>`
        : `<button class="btn" data-block="${e}" aria-label="Block deploys to ${e}">Block deploys</button>`}
    </div>`;
  };
  const liveNode = state.lives.length > 1 ? `<div class="par" role="group" aria-label="Environments">${state.lives.map(liveCard).join('')}</div>` : liveCard(state.lives[0]);
  // Stages that run at the same time ("parallel" in pipeline.json) stack in one column.
  const cards = (list, n) => list.reduce((cols, s) => (s.parallel && cols.length ? cols.at(-1).push(s) : cols.push([s]), cols), [])
    .map((col) => (col.length > 1 ? `<div class="par" role="group" aria-label="Run at the same time">${col.map((s) => stageCard(s, n)).join('')}</div>` : stageCard(col[0], n)));
  // A deploy waiting for a Promote click ("autoPromote": false) gets its own gate, just before the stage it waits at.
  const deployCards = cards(deploy, state.deployRow), pr = state.promote;
  if (pr) {
    const at = deploy.findIndex((s) => s.status === 'held');
    const col = deploy.slice(0, at + 1).filter((s) => !s.parallel).length - 1;
    deployCards.splice(Math.max(col, 0), 0, `<div class="node gate" role="group" aria-label="Promote">
      <span class="top">${icon('held')}Promote to ${esc(pr.environment)}</span>
      <button class="btn primary" id="promote">Promote build #${pr.number}</button>
      <p>Build #${pr.number} passed every stage before ${esc(pr.environment)}. It waits here until you promote it.</p>
    </div>`);
  }
  $('flow').innerHTML = [queueNode, ...cards(build, num), gateNode, ...deployCards, liveNode].join(arrow);
  fade();
  $('stopBuild').hidden = !busy;
  $('stopDeploy').hidden = !state.deploying;

  drawHistory();
  drawAgent();
  const sel = viewing ?? state.stages.find((s) => s.id === selected) ?? state.stages[0];
  // Retry sits above the log, named for the failed stage, so it shows even when another stage's log is open.
  const failed = state.stages.find((s) => s.id === state.retry);
  $('retry').hidden = !failed;
  if (failed) $('retry').textContent = `Retry ${failed.name}`;
  $('logTitle').textContent = viewing ? `Log: Build #${viewing.number} · ${sel.name}` : `Log: ${sel.name}`;
  const log = $('log'), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.textContent = sel.log.join('\n').replace(/^\n+/, '');
  log.dataset.empty = sel.status !== 'waiting' ? 'No output yet.' : state.builds.length ? `${sel.name} has not run${num && sel.group === 'build' ? ` for build #${num}` : ''} yet.` : 'Nothing has run yet. Tick pull requests and press Build.';
  if (atEnd) log.scrollTop = log.scrollHeight;

  const live = state.stages.map((s) => `${s.name} ${label[s.status]}`).join(', ');
  if (live !== lastLive) { $('live').textContent = live; lastLive = live; }
}

// All builds: where each one is now, what is in it, and (for builds from this run of the app) its stages and logs.
const where = { new: 'Waiting', building: 'Building', good: 'Green, not queued', bad: 'Bad', queued: 'Queued', deploying: 'Deploying', live: 'Live', replaced: 'Was live', failed: 'Deploy failed', stopped: 'Stopped (app restarted)' };
function drawHistory() {
  const env = esc(state.config.environment);
  $('history').innerHTML = state.builds.length ? state.builds.map((b) => `<li>
      <button class="hrow" data-build="${b.number}" aria-expanded="${openBuild === b.number}">
        <b>#${b.number}</b><span><span class="chip ${b.status}">${b.status === 'live' ? 'Live in ' + env : where[b.status] ?? b.status}</span></span>
        <span class="what">${b.by ? `<span class="tag" title="Started by an agent">by ${esc(b.by)}</span> ` : ''}${b.rollbackOf ? `Rollback to #${b.rollbackOf}: ` : ''}${b.prs.length ? b.prs.map((p) => `#${p.number} ${esc(p.title)}`).join(', ') : `${esc(state.config.branch)} as it was, no PRs`}</span>
        <time>${new Date(b.at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</time>
      </button>
      ${openBuild === b.number ? `<div class="hdetail">${buildStages.length ? buildStages.map((s) => `<button class="btn" data-log="${s.id}">${icon(s.status)}${esc(s.name)}</button>`).join('') : '<span class="none">Logs are only kept while the app runs.</span>'}
        ${b.deployedSha && b.status !== 'live' ? `<button class="btn primary" data-rollback="${b.number}" ${state.deploying ? 'disabled' : ''}>Roll back ${env} to build #${b.number}</button>` : ''}</div>` : ''}
    </li>`).join('') : '<li class="empty">No builds yet.</li>';
}
// Agent activity: what agents did through mcp.mjs, newest first. Every call, reads too, is in ~/.cicd-at-home/agent-log.jsonl.
const reads = ['status', 'build-log', 'prs'];
function said(a) {
  const n = a.args?.number;
  switch (a.action) {
    case 'status': return 'Read the pipeline';
    case 'build-log': return `Read the log of build #${n}`;
    case 'prs': return 'Refreshed the PR list';
    case 'build': return `${a.ok ? (a.build ? `Started build #${a.build}` : 'Asked for a build') : 'Tried to build'}${Array.isArray(a.args?.prs) && a.args.prs.length ? ` with ${a.args.prs.map((x) => '#' + x).join(', ')}` : ''}`;
    case 'retry': return `${a.ok ? 'Retried' : 'Tried to retry'} the failed stage of build #${n}`;
    case 'queue': return a.args?.action === 'resume' ? `${a.ok ? 'Resumed' : 'Tried to resume'} the queue` : 'Tried to change the queue';
    default: return `Tried to ${a.action}`;
  }
}
function drawAgent() {
  const list = agentLog.filter((a) => $('reads').checked || !reads.includes(a.action)).slice(-50).reverse();
  $('agent').innerHTML = list.length ? list.map((a) => `<li class="${reads.includes(a.action) ? 'read' : ''}">
      <time>${new Date(a.at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</time>
      <span class="by">${esc(a.agent)}</span>
      <span>${esc(said(a))}${a.error ? `<span class="why">${esc(a.error)}</span>` : ''}</span>
      <span class="chip ${a.ok ? 'passed' : 'failed'}">${a.ok ? 'Done' : a.refused ? 'Refused' : 'Failed'}</span>
    </li>`).join('') : `<li class="empty">${agentLog.length ? 'Only reads so far. Tick Show reads to see them.' : 'No agent has used the pipeline yet.'}</li>`;
}
$('reads').addEventListener('change', drawAgent);

$('history').addEventListener('click', async (e) => {
  const rb = e.target.closest('[data-rollback]');
  if (rb) {
    const n = Number(rb.dataset.rollback);
    if (confirm(`Roll ${state.config.environment} back to build #${n}? This rebuilds the commit it deployed and runs the deploy stages. Main on GitHub is not changed, and the queue pauses until you resume it.`)) post('/api/rollback', { number: n, profile: profile.value.trim() });
    return;
  }
  const lg = e.target.closest('[data-log]');
  if (lg) { const s = buildStages.find((x) => x.id === lg.dataset.log); viewing = { ...s, number: openBuild }; render(); $('log').scrollIntoView({ block: 'nearest' }); return; }
  const row = e.target.closest('[data-build]');
  if (!row) return;
  const n = Number(row.dataset.build);
  if (openBuild === n) { openBuild = null; render(); return; }
  openBuild = n; buildStages = [];
  const r = await fetch('/api/build-log', { method: 'POST', headers: { 'content-type': 'application/json', 'x-token': TOKEN }, body: JSON.stringify({ number: n }) });
  if (r.ok) buildStages = (await r.json()).stages;
  render();
});

new EventSource('/events').onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.type === 'state') {
    // The server was restarted (maybe updated): this page's token and code are stale, so start over.
    if (m.boot) { if (boot && boot !== m.boot) return location.reload(); boot = m.boot; }
    if (m.repos) repos = m.repos;
    if (m.agentLog) { agentLog = m.agentLog; drawAgent(); }
    if (!state && m.state) { picked = new Set(m.state.picked); selected = m.state.retry ?? selected; } // a new tab shows the batch already built, or the failed stage's log
    state = m.state; if (state) repos = state.repos;
    for (const s of state?.stages ?? []) { if (s.log) logs[s.id] = s.log; s.log = logs[s.id] ??= []; }
    // A stage that starts beside the one you are watching ("parallel", same lane) leaves that log open.
    const at = (id) => state.stages.find((s) => s.id === id);
    const started = (state?.running ?? []).filter((id) => !wasRunning.includes(id) && !(at(id)?.parallel && state.running.includes(selected) && at(selected)?.group === at(id).group));
    if (started.length) selected = started[0]; // follow a stage as it starts, but let the other lane's log stay open
    wasRunning = state?.running ?? [];
    render();
    if (started.length) follow();
  } else if (m.type === 'agent') {
    agentLog = [...agentLog, m.entry].slice(-100);
    drawAgent();
  } else if (m.type === 'reset') {
    logs[m.stage] = [];
    const s = state?.stages.find((x) => x.id === m.stage); if (s) s.log = logs[m.stage];
  } else if (m.type === 'log' && state) {
    (logs[m.stage] ??= []).push(m.line);
    if (logs[m.stage].length > 4000) logs[m.stage].splice(0, logs[m.stage].length - 4000);
    if (m.stage === selected && !viewing) {
      const log = $('log'), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
      log.append((log.textContent ? '\n' : '') + m.line);
      if (atEnd) log.scrollTop = log.scrollHeight;
    }
  }
};
// Running timer: only the times change, so leave the rest of the page (and the log) alone.
setInterval(() => {
  for (const s of state?.running.length ? state.stages : []) {
    const t = document.querySelector(`.stage[data-id="${CSS.escape(s.id)}"] .time`);
    if (t) t.textContent = took(s);
  }
}, 1000);

// Keep the stage that just started in view when the flow is wider than the screen.
function follow() {
  const f = $('flow'), c = f.querySelector(`.stage[data-id="${CSS.escape(selected)}"]`);
  if (c && f.scrollWidth > f.clientWidth) f.scrollTo({ left: c.offsetLeft - (f.clientWidth - c.offsetWidth) / 2, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
const fade = () => { const f = $('flow'); f.classList.toggle('more', f.scrollLeft + f.clientWidth < f.scrollWidth - 8); };
$('flow').addEventListener('scroll', fade, { passive: true });
addEventListener('resize', fade);
$('prs').addEventListener('change', (e) => { const n = Number(e.target.value); e.target.checked ? picked.add(n) : picked.delete(n); render(); });
$('flow').addEventListener('click', (e) => {
  if (e.target.closest('#deploy')) {
    const what = state.picked.length ? `merge PR ${state.picked.map((x) => '#' + x).join(', ')} on GitHub and deploy` : `deploy ${state.config.branch}`;
    const when = state.buildOk && !state.deploying ? '' : ' once it is ready';
    if (confirm(`This will ${what} to ${firstEnv()}${when}. Go?`)) post('/api/deploy');
    return;
  }
  const rm = e.target.closest('[data-remove]');
  if (rm) return post('/api/queue', { action: 'remove', number: Number(rm.dataset.remove) });
  if (e.target.closest('#resume')) return post('/api/queue', { action: 'resume' });
  if (e.target.closest('#promote')) {
    const p = state.promote;
    if (p && confirm(`Promote build #${p.number} to ${p.environment}? Its ${p.environment} stages run now.`)) post('/api/promote', p);
    return;
  }
  const bl = e.target.closest('[data-block]');
  if (bl) {
    const reason = prompt(`Block deploys to ${bl.dataset.block}? Builds wait before ${bl.dataset.block} until you unblock it. Say why, for whoever sees it:`, '');
    if (reason?.trim()) post('/api/block', { environment: bl.dataset.block, reason: reason.trim() });
    return;
  }
  const ub = e.target.closest('[data-unblock]');
  if (ub) return post('/api/block', { environment: ub.dataset.unblock, action: 'unblock' });
  const card = e.target.closest('.stage');
  if (card) { selected = card.dataset.id; viewing = null; render(); }
});
const pickable = () => [...picked].filter((x) => state.prs.some((p) => p.number === x && !p.draft) && !state.deployingPrs.includes(x));
$('build').addEventListener('click', () => { showError(''); post('/api/build', { prs: pickable(), profile: profile.value.trim() }); });
$('retry').addEventListener('click', () => {
  const s = state.stages.find((x) => x.id === state.retry);
  if (s && confirm(`Run ${s.name} again for build #${state.deployRow}, then the stages after it? Nothing is merged again.`)) post('/api/retry', { number: state.deployRow });
});
$('stopBuild').addEventListener('click', () => post('/api/stop', { lane: 'build' }));
$('stopDeploy').addEventListener('click', () => post('/api/stop', { lane: 'deploy' }));
$('refresh').addEventListener('click', () => post('/api/prs'));
$('repo').addEventListener('change', (e) => { picked.clear(); post('/api/repo', { path: e.target.value }); });
$('addForm').addEventListener('submit', (e) => { e.preventDefault(); const p = $('addPath').value.trim(); if (p) post('/api/repo', { path: p }).then((ok) => ok && ($('addPath').value = '')); });
</script>
</body>
</html>
